name: Refresh tech feed

# Every 6 hours: new stories for "What's new in tech" (~50 a day), then deploy.
# Needs AZURE_OPENAI_ENDPOINT and AZURE_OPENAI_API_KEY secrets. Scheduled runs start once on main.
on:
  # Feed is switched off in the app for now, so the 6-hourly refresh is off too.
  # schedule:
  #   - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: trending
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write new stories
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
        run: node scripts/build-trending.mjs
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- web/content/trending.json; then echo "Nothing new"; exit 0; fi
          git config user.name "preppilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/content/trending.json
          git commit -m "Tech feed refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
