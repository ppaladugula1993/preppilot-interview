name: iOS release (EAS build + TestFlight)

# Manual only: Actions tab -> "iOS release" -> Run workflow.
# Needs the EXPO_TOKEN repository secret. Signing credentials and the App Store Connect
# API key comes from this repository's ASC_* secrets for the TestFlight upload.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Upload the finished build to TestFlight
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: .
        run: npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build on EAS
        # With upload: wait for the build, so the next step can send it to TestFlight.
        run: |
          if [ "${{ inputs.submit }}" = "true" ]; then eas build -p ios --profile production --non-interactive --wait
          else eas build -p ios --profile production --non-interactive --no-wait; fi
      - name: Upload to TestFlight
        if: ${{ inputs.submit }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # eas submit reads the App Store Connect key from eas.json, so add it for this run only.
        run: |
          printf '%s\n' "$ASC_KEY_P8" > asc-key.p8
          node -e "const f='eas.json',j=require('./'+f);Object.assign(j.submit.production.ios,{ascApiKeyPath:'./asc-key.p8',ascApiKeyId:process.env.ASC_KEY_ID,ascApiKeyIssuerId:process.env.ASC_ISSUER_ID});require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          eas submit -p ios --profile production --latest --non-interactive --wait
